spring.application.name=CreatorStore

# information de la base de données, soit les mentionner en dur, soit les prendre depuis ENV
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# configuration de l'ORM -> Hibernate
# indique a hibernate cmt la structure des tables sql a partir de mes classes via @Entity
spring.jpa.hibernate.ddl-auto=update

#afficher directement dans la console les vraies requetes sql faites
spring.jpa.show-sql=true

#formates les requetes sql pour qu'elles soient lisible
spring.jpa.properties.hibernate.format-sql=true